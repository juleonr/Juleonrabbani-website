<rect x="352.0" y="492.0" width="196" height="104" fill="#FFFFFF" stroke="#B07A16" stroke-width="1.8"/>
<text x="450.0" y="514.9" text-anchor="middle" font-size="14" fill="#121A17">Draft the study:</text>
<text x="450.0" y="531.9" text-anchor="middle" font-size="14" fill="#121A17">population, design fit,</text>
<text x="450.0" y="548.9" text-anchor="middle" font-size="14" fill="#121A17">endpoints, provenance,</text>
<text x="450.0" y="565.9" text-anchor="middle" font-size="14" fill="#121A17">data collection; ask up</text>
<text x="450.0" y="582.9" text-anchor="middle" font-size="14" fill="#121A17">to 3 questions</text>
<polygon points="366.0,224.0 548.0,224.0 534.0,328.0 352.0,328.0" fill="#FFFFFF" stroke="#0F6B5B" stroke-width="1.8"/>
<text x="450.0" y="254.25" text-anchor="middle" font-size="15" fill="#121A17">Answer the model&#x27;s</text>
