<text x="1394.0" y="808.25" text-anchor="middle" font-size="15" fill="#121A17">inputs, 17 methods;</text>
<text x="1394.0" y="826.25" text-anchor="middle" font-size="15" fill="#121A17">none or simulation give</text>
<text x="1394.0" y="844.25" text-anchor="middle" font-size="15" fill="#121A17">no number</text>
