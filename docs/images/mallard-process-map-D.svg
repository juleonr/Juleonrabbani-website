<text x="1394.0" y="256.55" text-anchor="middle" font-size="13" fill="#121A17">fields), sizing</text>
<text x="1394.0" y="272.55" text-anchor="middle" font-size="13" fill="#121A17">assumptions (8 fields),</text>
<text x="1394.0" y="288.55" text-anchor="middle" font-size="13" fill="#121A17">calculator inputs;</text>
