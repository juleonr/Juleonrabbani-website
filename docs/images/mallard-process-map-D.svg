<text x="922.0" y="799.9" text-anchor="middle" font-size="14" fill="#121A17">analysis, diagram</text>
<text x="922.0" y="816.9" text-anchor="middle" font-size="14" fill="#121A17">and exhibits</text>
<text x="922.0" y="833.9" text-anchor="middle" font-size="14" fill="#121A17">contradict the</text>
<text x="922.0" y="850.9" text-anchor="middle" font-size="14" fill="#121A17">estimand?</text>
