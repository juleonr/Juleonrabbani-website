<text x="922.0" y="548.9" text-anchor="middle" font-size="14" fill="#121A17">guarded patch;</text>
<text x="922.0" y="565.9" text-anchor="middle" font-size="14" fill="#121A17">adjudicator judges,</text>
<text x="922.0" y="582.9" text-anchor="middle" font-size="14" fill="#121A17">never edits</text>
