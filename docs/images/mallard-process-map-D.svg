<text x="1158.0" y="808.25" text-anchor="middle" font-size="15" fill="#121A17">everywhere; warn and</text>
<text x="1158.0" y="826.25" text-anchor="middle" font-size="15" fill="#121A17">block findings shown</text>
<text x="1158.0" y="844.25" text-anchor="middle" font-size="15" fill="#121A17">with the plan</text>
