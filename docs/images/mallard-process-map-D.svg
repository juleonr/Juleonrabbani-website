<text x="686.0" y="540.55" text-anchor="middle" font-size="13" fill="#121A17">token, exhibits, code</text>
<text x="686.0" y="556.55" text-anchor="middle" font-size="13" fill="#121A17">scope; propose</text>
<text x="686.0" y="572.55" text-anchor="middle" font-size="13" fill="#121A17">multiplicity and accrual;</text>
<text x="686.0" y="588.55" text-anchor="middle" font-size="13" fill="#121A17">ask 1 question</text>
<rect x="824.0" y="492.0" width="196" height="104" fill="#FFFFFF" stroke="#B07A16" stroke-width="1.8"/>
<text x="922.0" y="514.9" text-anchor="middle" font-size="14" fill="#121A17">Two reviewers with 7</text>
