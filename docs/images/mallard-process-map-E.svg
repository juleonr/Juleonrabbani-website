<rect width="1642" height="976" fill="#FFFFFF"/>
<text x="96" y="34" font-size="22" font-weight="700" fill="#121A17">Panel E. Phase 4: shared decisions, revision and the analysis gate</text>
<text x="96" y="56" font-size="14" fill="#5F6B66">Time runs left to right. Parallelogram = investigator input · diamond = decision · rectangle = process · rounded = start or end · page shape = output.</text>
<text x="96" y="76" font-size="14" fill="#5F6B66">Numbered circles continue on the next panel. Investigator inputs are tagged I1 to I11 and decisions D1 to D11, in the order they are made; plain rectangles in the investigator lane are presses.</text>
<rect x="96" y="142" width="1416" height="268" fill="#F4F8F6" stroke="#CDD4D0"/>
