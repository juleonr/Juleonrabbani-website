<text x="450.0" y="254.25" text-anchor="middle" font-size="15" fill="#121A17">Count reconciliation:</text>
<text x="450.0" y="272.25" text-anchor="middle" font-size="15" fill="#121A17">unit, required, cap,</text>
<text x="450.0" y="290.25" text-anchor="middle" font-size="15" fill="#121A17">available, source,</text>
<text x="450.0" y="308.25" text-anchor="middle" font-size="15" fill="#121A17">sizing approach per row</text>
