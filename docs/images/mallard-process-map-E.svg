<text x="1158.0" y="281.25" text-anchor="middle" font-size="15" fill="#121A17">the generated</text>
<text x="1158.0" y="299.25" text-anchor="middle" font-size="15" fill="#121A17">changes?</text>
<rect x="1048.0" y="179.0" width="34" height="20" rx="4" fill="#0F6B5B"/><text x="1065.0" y="194.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF">D9</text>
<polygon points="1394.0,738.0 1504.0,812.0 1394.0,886.0 1284.0,812.0" fill="#FFF7E6" stroke="#3A4A78" stroke-width="1.8"/>
<text x="1394.0" y="782.9" text-anchor="middle" font-size="14" fill="#121A17">Phase 4 gate: contract,</text>
