<text x="450.0" y="782.9" text-anchor="middle" font-size="14" fill="#121A17">Available count</text>
<text x="450.0" y="799.9" text-anchor="middle" font-size="14" fill="#121A17">established, or a</text>
<text x="450.0" y="816.9" text-anchor="middle" font-size="14" fill="#121A17">provisional caveat</text>
<text x="450.0" y="833.9" text-anchor="middle" font-size="14" fill="#121A17">carried into the</text>
<text x="450.0" y="850.9" text-anchor="middle" font-size="14" fill="#121A17">package?</text>
<polygon points="686.0,202.0 796.0,276.0 686.0,350.0 576.0,276.0" fill="#FFF7E6" stroke="#0F6B5B" stroke-width="1.8"/>
<text x="686.0" y="254.25" text-anchor="middle" font-size="15" fill="#121A17">Changed a confirmed</text>
<text x="686.0" y="272.25" text-anchor="middle" font-size="15" fill="#121A17">decision? Save without</text>
<text x="686.0" y="290.25" text-anchor="middle" font-size="15" fill="#121A17">regenerating, or save and</text>
<text x="686.0" y="308.25" text-anchor="middle" font-size="15" fill="#121A17">update affected sections?</text>
<rect x="576.0" y="179.0" width="34" height="20" rx="4" fill="#0F6B5B"/><text x="593.0" y="194.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF">D8</text>
