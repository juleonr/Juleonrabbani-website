<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="976" viewBox="0 0 1500 976" font-family="Helvetica, Arial, sans-serif" font-size="15">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B3A35"/></marker></defs>
<rect width="1500" height="976" fill="#FFFFFF"/>
<text x="96" y="34" font-size="22" font-weight="700" fill="#121A17">Panel E. Execution and finalisation</text>
<text x="96" y="56" font-size="14" fill="#5F6B66">Time runs left to right. Parallelogram = investigator input · diamond = decision · rectangle = process · rounded = start or end · page shape = output.</text>
<text x="96" y="76" font-size="14" fill="#5F6B66">Numbered circles continue on the next panel. Investigator inputs are tagged I1 to I11 and decisions D1 to D11, in the order they are made.</text>
<rect x="96" y="142" width="1180" height="268" fill="#F4F8F6" stroke="#CDD4D0"/>
