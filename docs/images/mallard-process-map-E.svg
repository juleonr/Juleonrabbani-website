<rect x="116.0" y="492.0" width="196" height="104" fill="#FFFFFF" stroke="#B07A16" stroke-width="1.8"/>
<text x="214.0" y="522.25" text-anchor="middle" font-size="15" fill="#121A17">Draft step 5,</text>
<text x="214.0" y="540.25" text-anchor="middle" font-size="15" fill="#121A17">approvals, team and</text>
<text x="214.0" y="558.25" text-anchor="middle" font-size="15" fill="#121A17">cost, on its own after</text>
<text x="214.0" y="576.25" text-anchor="middle" font-size="15" fill="#121A17">step 4</text>
<polygon points="130.0,224.0 312.0,224.0 298.0,328.0 116.0,328.0" fill="#FFFFFF" stroke="#0F6B5B" stroke-width="1.8"/>
<text x="214.0" y="246.9" text-anchor="middle" font-size="14" fill="#121A17">Execution fields,</text>
<text x="214.0" y="263.9" text-anchor="middle" font-size="14" fill="#121A17">governance pathway,</text>
<text x="214.0" y="280.9" text-anchor="middle" font-size="14" fill="#121A17">tasks with owners,</text>
<text x="214.0" y="297.9" text-anchor="middle" font-size="14" fill="#121A17">timeline, costs,</text>
<text x="214.0" y="314.9" text-anchor="middle" font-size="14" fill="#121A17">currency</text>
<rect x="116.0" y="201.0" width="34" height="20" rx="4" fill="#0F6B5B"/><text x="133.0" y="216.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF">I10</text>
<polygon points="450.0,202.0 560.0,276.0 450.0,350.0 340.0,276.0" fill="#FFF7E6" stroke="#0F6B5B" stroke-width="1.8"/>
<text x="450.0" y="263.25" text-anchor="middle" font-size="15" fill="#121A17">Readiness: ready,</text>
<text x="450.0" y="281.25" text-anchor="middle" font-size="15" fill="#121A17">conditional, or</text>
<text x="450.0" y="299.25" text-anchor="middle" font-size="15" fill="#121A17">infeasible?</text>
<rect x="340.0" y="179.0" width="34" height="20" rx="4" fill="#0F6B5B"/><text x="357.0" y="194.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF">D10</text>
<polygon points="450.0,738.0 560.0,812.0 450.0,886.0 340.0,812.0" fill="#FFF7E6" stroke="#3A4A78" stroke-width="1.8"/>
<text x="450.0" y="782.9" text-anchor="middle" font-size="14" fill="#121A17">Execution gate: dates</text>
<text x="450.0" y="799.9" text-anchor="middle" font-size="14" fill="#121A17">ordered, no dependency</text>
<text x="450.0" y="816.9" text-anchor="middle" font-size="14" fill="#121A17">cycles, every cost</text>
<text x="450.0" y="833.9" text-anchor="middle" font-size="14" fill="#121A17">priced or marked not</text>
<text x="450.0" y="850.9" text-anchor="middle" font-size="14" fill="#121A17">established?</text>
<polygon points="686.0,202.0 796.0,276.0 686.0,350.0 576.0,276.0" fill="#FFF7E6" stroke="#0F6B5B" stroke-width="1.8"/>
<text x="686.0" y="254.25" text-anchor="middle" font-size="15" fill="#121A17">Request the write-up?</text>
<text x="686.0" y="272.25" text-anchor="middle" font-size="15" fill="#121A17">Request code, in which</text>
<text x="686.0" y="290.25" text-anchor="middle" font-size="15" fill="#121A17">languages, reviewed</text>
<text x="686.0" y="308.25" text-anchor="middle" font-size="15" fill="#121A17">draft or not requested?</text>
<rect x="576.0" y="179.0" width="34" height="20" rx="4" fill="#0F6B5B"/><text x="593.0" y="194.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF">D11</text>
<rect x="588.0" y="492.0" width="196" height="104" fill="#FFFFFF" stroke="#B07A16" stroke-width="1.8"/>
<text x="686.0" y="514.9" text-anchor="middle" font-size="14" fill="#121A17">On request: write-up</text>
<text x="686.0" y="531.9" text-anchor="middle" font-size="14" fill="#121A17">with PubMed-resolved</text>
<text x="686.0" y="548.9" text-anchor="middle" font-size="14" fill="#121A17">references; code in R,</text>
<text x="686.0" y="565.9" text-anchor="middle" font-size="14" fill="#121A17">Python, SAS, Stata,</text>
<text x="686.0" y="582.9" text-anchor="middle" font-size="14" fill="#121A17">never executed</text>
<polygon points="838.0,224.0 1020.0,224.0 1006.0,328.0 824.0,328.0" fill="#FFFFFF" stroke="#0F6B5B" stroke-width="1.8"/>
<text x="922.0" y="254.25" text-anchor="middle" font-size="15" fill="#121A17">Name the reconciler;</text>
<text x="922.0" y="272.25" text-anchor="middle" font-size="15" fill="#121A17">review summary with</text>
<text x="922.0" y="290.25" text-anchor="middle" font-size="15" fill="#121A17">remaining limitations;</text>
<text x="922.0" y="308.25" text-anchor="middle" font-size="15" fill="#121A17">choose export format</text>
<rect x="824.0" y="201.0" width="34" height="20" rx="4" fill="#0F6B5B"/><text x="841.0" y="216.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF">I11</text>
<polygon points="922.0,738.0 1032.0,812.0 922.0,886.0 812.0,812.0" fill="#FFF7E6" stroke="#3A4A78" stroke-width="1.8"/>
<text x="922.0" y="790.25" text-anchor="middle" font-size="15" fill="#121A17">Finalisation gate: no</text>
<text x="922.0" y="808.25" text-anchor="middle" font-size="15" fill="#121A17">open review comments,</text>
<text x="922.0" y="826.25" text-anchor="middle" font-size="15" fill="#121A17">nothing pending, code</text>
<text x="922.0" y="844.25" text-anchor="middle" font-size="15" fill="#121A17">disposition recorded?</text>
<path d="M1060.0,749.0 H1256.0 V865.0 Q1207.0,853.0 1158.0,867.0 T1060.0,865.0 Z" fill="#EEF5F2" stroke="#3A4A78" stroke-width="1.8"/>
<text x="1158.0" y="782.9" text-anchor="middle" font-size="14" fill="#121A17">Export: text, HTML,</text>
<text x="1158.0" y="799.9" text-anchor="middle" font-size="14" fill="#121A17">Word or ZIP, with audit</text>
<text x="1158.0" y="816.9" text-anchor="middle" font-size="14" fill="#121A17">table, gate status,</text>
<text x="1158.0" y="833.9" text-anchor="middle" font-size="14" fill="#121A17">assumptions and review</text>
<text x="1158.0" y="850.9" text-anchor="middle" font-size="14" fill="#121A17">record</text>
<rect x="1060.0" y="224.0" width="196" height="104" rx="52.0" fill="#0F6B5B" stroke="#0F6B5B" stroke-width="1.8"/>
<text x="1158.0" y="263.25" text-anchor="middle" font-size="15" fill="#FFFFFF">End: plan delivered for</text>
<text x="1158.0" y="281.25" text-anchor="middle" font-size="15" fill="#FFFFFF">a statistician and the</text>
<text x="1158.0" y="299.25" text-anchor="middle" font-size="15" fill="#FFFFFF">IRB to check</text>
</svg>