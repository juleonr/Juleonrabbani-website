<text x="922.0" y="576.25" text-anchor="middle" font-size="15" fill="#121A17">sections</text>
<rect x="824.0" y="760.0" width="196" height="104" fill="#FFFFFF" stroke="#3A4A78" stroke-width="1.8"/>
<text x="922.0" y="790.25" text-anchor="middle" font-size="15" fill="#121A17">Result held pending</text>
<text x="922.0" y="808.25" text-anchor="middle" font-size="15" fill="#121A17">with a diff; refused if</text>
<text x="922.0" y="826.25" text-anchor="middle" font-size="15" fill="#121A17">the decisions changed</text>
<text x="922.0" y="844.25" text-anchor="middle" font-size="15" fill="#121A17">meanwhile</text>
