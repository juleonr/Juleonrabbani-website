<text x="930.0" y="160.0" font-size="12.5" fill="#3B4743" paint-order="stroke" stroke="#FFFFFF" stroke-width="4">no</text>
<path d="M1172.0,328.0 L1172.0,492.0" fill="none" stroke="#2B3A35" stroke-width="1.6" marker-end="url(#arr)"/>
