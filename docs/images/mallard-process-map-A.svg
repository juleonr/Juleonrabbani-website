<text x="1146.0" y="684" font-size="12.5" fill="#3B4743" paint-order="stroke" stroke="#FFFFFF" stroke-width="4">no</text>
<line x1="1730.0" y1="812.0" x2="1752.0" y2="812.0" stroke="#2B3A35" stroke-width="1.6" marker-end="url(#arr)"/>
<circle cx="1768.0" cy="812.0" r="14" fill="#FFFFFF" stroke="#2B3A35" stroke-width="1.6"/><text x="1768.0" y="817.0" text-anchor="middle" font-size="14" font-weight="700">1</text>
<text x="1732.0" y="802.0" font-size="12.5" fill="#5F6B66">yes</text>
<rect x="116.0" y="224.0" width="196" height="104" rx="52.0" fill="#0F6B5B" stroke="#0F6B5B" stroke-width="1.8"/>
<text x="214.0" y="263.25" text-anchor="middle" font-size="15" fill="#FFFFFF">Start: describe the</text>
<text x="214.0" y="281.25" text-anchor="middle" font-size="15" fill="#FFFFFF">study in plain language</text>
<text x="214.0" y="299.25" text-anchor="middle" font-size="15" fill="#FFFFFF">or upload a file</text>
<rect x="116.0" y="760.0" width="196" height="104" fill="#FFFFFF" stroke="#3A4A78" stroke-width="1.8"/>
<text x="214.0" y="790.25" text-anchor="middle" font-size="15" fill="#121A17">Strip PHI on upload and</text>
<text x="214.0" y="808.25" text-anchor="middle" font-size="15" fill="#121A17">again at Generate;</text>
<text x="214.0" y="826.25" text-anchor="middle" font-size="15" fill="#121A17">report categories and</text>
<text x="214.0" y="844.25" text-anchor="middle" font-size="15" fill="#121A17">counts only</text>
<polygon points="366.0,224.0 548.0,224.0 534.0,328.0 352.0,328.0" fill="#FFFFFF" stroke="#0F6B5B" stroke-width="1.8"/>
<text x="450.0" y="240.55" text-anchor="middle" font-size="13" fill="#121A17">Answer 9 context</text>
<text x="450.0" y="256.55" text-anchor="middle" font-size="13" fill="#121A17">fields: use,</text>
<text x="450.0" y="272.55" text-anchor="middle" font-size="13" fill="#121A17">deliverable, horizon,</text>
<text x="450.0" y="288.55" text-anchor="middle" font-size="13" fill="#121A17">data state, source,</text>
<text x="450.0" y="304.55" text-anchor="middle" font-size="13" fill="#121A17">funding, team, analyst,</text>
<text x="450.0" y="320.55" text-anchor="middle" font-size="13" fill="#121A17">design lead</text>
<rect x="352.0" y="201.0" width="34" height="20" rx="4" fill="#0F6B5B"/><text x="369.0" y="216.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF">I1</text>
<polygon points="450.0,738.0 560.0,812.0 450.0,886.0 340.0,812.0" fill="#FFF7E6" stroke="#3A4A78" stroke-width="1.8"/>
<text x="450.0" y="799.25" text-anchor="middle" font-size="15" fill="#121A17">All 9 answered?</text>
<text x="450.0" y="817.25" text-anchor="middle" font-size="15" fill="#121A17">(&quot;Not sure yet&quot;</text>
<text x="450.0" y="835.25" text-anchor="middle" font-size="15" fill="#121A17">counts)</text>
<rect x="588.0" y="492.0" width="196" height="104" fill="#FFFFFF" stroke="#B07A16" stroke-width="1.8"/>
<text x="686.0" y="522.25" text-anchor="middle" font-size="15" fill="#121A17">Suggest up to 3 aims,</text>
<text x="686.0" y="540.25" text-anchor="middle" font-size="15" fill="#121A17">alternatives and a</text>
<text x="686.0" y="558.25" text-anchor="middle" font-size="15" fill="#121A17">hypothesis, with</text>
<text x="686.0" y="576.25" text-anchor="middle" font-size="15" fill="#121A17">bracketed placeholders</text>
<polygon points="602.0,224.0 784.0,224.0 770.0,328.0 588.0,328.0" fill="#FFFFFF" stroke="#0F6B5B" stroke-width="1.8"/>
<text x="686.0" y="254.25" text-anchor="middle" font-size="15" fill="#121A17">Edit aims; fill</text>
<text x="686.0" y="272.25" text-anchor="middle" font-size="15" fill="#121A17">placeholders; set role</text>
<text x="686.0" y="290.25" text-anchor="middle" font-size="15" fill="#121A17">per aim; state intended</text>
<text x="686.0" y="308.25" text-anchor="middle" font-size="15" fill="#121A17">claim</text>
<rect x="588.0" y="201.0" width="34" height="20" rx="4" fill="#0F6B5B"/><text x="605.0" y="216.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF">I2</text>
<polygon points="922.0,202.0 1032.0,276.0 922.0,350.0 812.0,276.0" fill="#FFF7E6" stroke="#0F6B5B" stroke-width="1.8"/>
<text x="922.0" y="272.25" text-anchor="middle" font-size="15" fill="#121A17">Any aim</text>
<text x="922.0" y="290.25" text-anchor="middle" font-size="15" fill="#121A17">confirmatory?</text>
<rect x="812.0" y="179.0" width="34" height="20" rx="4" fill="#0F6B5B"/><text x="829.0" y="194.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF">D1</text>
<polygon points="1074.0,224.0 1256.0,224.0 1242.0,328.0 1060.0,328.0" fill="#FFFFFF" stroke="#0F6B5B" stroke-width="1.8"/>
<text x="1158.0" y="263.25" text-anchor="middle" font-size="15" fill="#121A17">Write the hypothesis</text>
<text x="1158.0" y="281.25" text-anchor="middle" font-size="15" fill="#121A17">(multiplicity fields</text>
<text x="1158.0" y="299.25" text-anchor="middle" font-size="15" fill="#121A17">become required later)</text>
<rect x="1060.0" y="201.0" width="34" height="20" rx="4" fill="#0F6B5B"/><text x="1077.0" y="216.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF">I3</text>
<rect x="1060.0" y="492.0" width="196" height="104" fill="#FFFFFF" stroke="#B07A16" stroke-width="1.8"/>
<text x="1158.0" y="531.25" text-anchor="middle" font-size="15" fill="#121A17">Aims check: findings on</text>
<text x="1158.0" y="549.25" text-anchor="middle" font-size="15" fill="#121A17">scope, causal wording,</text>
<text x="1158.0" y="567.25" text-anchor="middle" font-size="15" fill="#121A17">missing details</text>
<polygon points="1394.0,202.0 1504.0,276.0 1394.0,350.0 1284.0,276.0" fill="#FFF7E6" stroke="#0F6B5B" stroke-width="1.8"/>
<text x="1394.0" y="254.25" text-anchor="middle" font-size="15" fill="#121A17">Apply the finding,</text>
<text x="1394.0" y="272.25" text-anchor="middle" font-size="15" fill="#121A17">keep mine with a</text>
<text x="1394.0" y="290.25" text-anchor="middle" font-size="15" fill="#121A17">written reason, or</text>
<text x="1394.0" y="308.25" text-anchor="middle" font-size="15" fill="#121A17">skip?</text>
<rect x="1284.0" y="179.0" width="34" height="20" rx="4" fill="#0F6B5B"/><text x="1301.0" y="194.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF">D2</text>
<rect x="1296.0" y="492.0" width="196" height="104" fill="#FFFFFF" stroke="#B07A16" stroke-width="1.8"/>
<text x="1394.0" y="531.25" text-anchor="middle" font-size="15" fill="#121A17">Literature scan: emit</text>
<text x="1394.0" y="549.25" text-anchor="middle" font-size="15" fill="#121A17">PubMed queries, never</text>
<text x="1394.0" y="567.25" text-anchor="middle" font-size="15" fill="#121A17">citation text</text>
<rect x="1296.0" y="760.0" width="196" height="104" fill="#FFFFFF" stroke="#3A4A78" stroke-width="1.8"/>
<text x="1394.0" y="790.25" text-anchor="middle" font-size="15" fill="#121A17">Resolve each query</text>
<text x="1394.0" y="808.25" text-anchor="middle" font-size="15" fill="#121A17">against PubMed; refuse</text>
<text x="1394.0" y="826.25" text-anchor="middle" font-size="15" fill="#121A17">a summary citing an</text>
<text x="1394.0" y="844.25" text-anchor="middle" font-size="15" fill="#121A17">unretrieved record</text>
<polygon points="1630.0,738.0 1740.0,812.0 1630.0,886.0 1520.0,812.0" fill="#FFF7E6" stroke="#3A4A78" stroke-width="1.8"/>
<text x="1630.0" y="782.9" text-anchor="middle" font-size="14" fill="#121A17">Question gate: 1 to</text>
<text x="1630.0" y="799.9" text-anchor="middle" font-size="14" fill="#121A17">3 aims, each with a</text>
<text x="1630.0" y="816.9" text-anchor="middle" font-size="14" fill="#121A17">role, claim and</text>
<text x="1630.0" y="833.9" text-anchor="middle" font-size="14" fill="#121A17">hypothesis if</text>
<text x="1630.0" y="850.9" text-anchor="middle" font-size="14" fill="#121A17">confirmatory?</text>
</svg>