<text text-anchor="middle" fill="#FFFFFF" font-weight="700" font-size="16" y="-6">Deterministic code</text>
<text text-anchor="middle" fill="#FFFFFF" font-size="12.5" y="14">gates, calculators, checks</text></g>
<rect x="96" y="96" width="1652" height="46" fill="#E8EEEA" stroke="#CDD4D0"/>
<text x="922.0" y="125" text-anchor="middle" font-size="16" font-weight="700" fill="#0F6B5B">Context and aims</text>
