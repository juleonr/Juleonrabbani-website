<rect width="1788" height="976" fill="#FFFFFF"/>
<text x="96" y="34" font-size="22" font-weight="700" fill="#121A17">Panel A. Context and aims</text>
<text x="96" y="56" font-size="14" fill="#5F6B66">Time runs left to right. Parallelogram = investigator input · diamond = decision · rectangle = process · rounded = start or end · page shape = output.</text>
<text x="96" y="76" font-size="14" fill="#5F6B66">Numbered circles continue on the next panel. Investigator inputs are tagged I1 to I11 and decisions D1 to D11, in the order they are made.</text>
<rect x="96" y="142" width="1652" height="268" fill="#F4F8F6" stroke="#CDD4D0"/>
<rect x="8" y="142" width="88" height="268" fill="#0F6B5B" stroke="#CDD4D0"/>
<g transform="translate(52,276.0) rotate(-90)">
<text text-anchor="middle" fill="#FFFFFF" font-weight="700" font-size="16" y="-6">Investigator</text>
<text text-anchor="middle" fill="#FFFFFF" font-size="12.5" y="14">inputs and decisions</text></g>
<rect x="96" y="410" width="1652" height="268" fill="#FBF6EC" stroke="#CDD4D0"/>
<rect x="8" y="410" width="88" height="268" fill="#B07A16" stroke="#CDD4D0"/>
<g transform="translate(52,544.0) rotate(-90)">
<text text-anchor="middle" fill="#FFFFFF" font-weight="700" font-size="16" y="-6">Stochastic LLMs</text>
<text text-anchor="middle" fill="#FFFFFF" font-size="12.5" y="14">draft and review</text></g>
<rect x="96" y="678" width="1652" height="268" fill="#F1F3F7" stroke="#CDD4D0"/>
<rect x="8" y="678" width="88" height="268" fill="#3A4A78" stroke="#CDD4D0"/>
