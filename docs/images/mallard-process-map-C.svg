<rect x="8" y="410" width="88" height="268" fill="#B07A16" stroke="#CDD4D0"/>
<g transform="translate(52,544.0) rotate(-90)">
<text text-anchor="middle" fill="#FFFFFF" font-weight="700" font-size="16" y="-6">Stochastic LLMs</text>
<text text-anchor="middle" fill="#FFFFFF" font-size="12.5" y="14">draft and review</text></g>
