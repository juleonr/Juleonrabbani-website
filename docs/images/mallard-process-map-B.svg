<text x="450.0" y="246.9" text-anchor="middle" font-size="14" fill="#121A17">Basis for each</text>
<text x="450.0" y="263.9" text-anchor="middle" font-size="14" fill="#121A17">answer: checked</text>
<text x="450.0" y="280.9" text-anchor="middle" font-size="14" fill="#121A17">result, planning</text>
<text x="450.0" y="297.9" text-anchor="middle" font-size="14" fill="#121A17">assumption, or a</text>
<text x="450.0" y="314.9" text-anchor="middle" font-size="14" fill="#121A17">task for someone?</text>
<rect x="340.0" y="179.0" width="34" height="20" rx="4" fill="#0F6B5B"/><text x="357.0" y="194.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF">D3</text>
