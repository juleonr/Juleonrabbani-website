<text x="1158.0" y="272.25" text-anchor="middle" font-size="15" fill="#121A17">recommended design,</text>
<text x="1158.0" y="290.25" text-anchor="middle" font-size="15" fill="#121A17">or pick one of up to</text>
<text x="1158.0" y="308.25" text-anchor="middle" font-size="15" fill="#121A17">3 alternatives?</text>
<rect x="1048.0" y="179.0" width="34" height="20" rx="4" fill="#0F6B5B"/><text x="1065.0" y="194.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF">D4</text>
