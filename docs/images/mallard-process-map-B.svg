<text x="214.0" y="272.55" text-anchor="middle" font-size="13" fill="#121A17">permissions,</text>
<text x="214.0" y="288.55" text-anchor="middle" font-size="13" fill="#121A17">collection, variables,</text>
<text x="214.0" y="304.55" text-anchor="middle" font-size="13" fill="#121A17">counts, consistency,</text>
<text x="214.0" y="320.55" text-anchor="middle" font-size="13" fill="#121A17">resources</text>
<rect x="116.0" y="201.0" width="34" height="20" rx="4" fill="#0F6B5B"/><text x="133.0" y="216.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF">I4</text>
