<text x="450.0" y="782.9" text-anchor="middle" font-size="14" fill="#121A17">Feasibility gate:</text>
<text x="450.0" y="799.9" text-anchor="middle" font-size="14" fill="#121A17">every row has a</text>
<text x="450.0" y="816.9" text-anchor="middle" font-size="14" fill="#121A17">basis, a result and,</text>
<text x="450.0" y="833.9" text-anchor="middle" font-size="14" fill="#121A17">for a task, an</text>
<text x="450.0" y="850.9" text-anchor="middle" font-size="14" fill="#121A17">owner?</text>
<rect x="588.0" y="492.0" width="196" height="104" fill="#FFFFFF" stroke="#B07A16" stroke-width="1.8"/>
<text x="686.0" y="514.9" text-anchor="middle" font-size="14" fill="#121A17">Draft the design brief:</text>
<text x="686.0" y="531.9" text-anchor="middle" font-size="14" fill="#121A17">design, typed estimand,</text>
<text x="686.0" y="548.9" text-anchor="middle" font-size="14" fill="#121A17">conditions with record</text>
<text x="686.0" y="565.9" text-anchor="middle" font-size="14" fill="#121A17">checks, alternatives,</text>
<text x="686.0" y="582.9" text-anchor="middle" font-size="14" fill="#121A17">sizing method</text>
<rect x="824.0" y="492.0" width="196" height="104" fill="#FFFFFF" stroke="#B07A16" stroke-width="1.8"/>
<text x="922.0" y="522.25" text-anchor="middle" font-size="15" fill="#121A17">Anthropic and OpenAI</text>
<text x="922.0" y="540.25" text-anchor="middle" font-size="15" fill="#121A17">review; worst case</text>
<text x="922.0" y="558.25" text-anchor="middle" font-size="15" fill="#121A17">merged; brief</text>
<text x="922.0" y="576.25" text-anchor="middle" font-size="15" fill="#121A17">re-emitted whole</text>
<rect x="824.0" y="760.0" width="196" height="104" fill="#FFFFFF" stroke="#3A4A78" stroke-width="1.8"/>
<text x="922.0" y="790.25" text-anchor="middle" font-size="15" fill="#121A17">Brief estimand and</text>
<text x="922.0" y="808.25" text-anchor="middle" font-size="15" fill="#121A17">evidence-level checks;</text>
<text x="922.0" y="826.25" text-anchor="middle" font-size="15" fill="#121A17">blocking findings feed</text>
<text x="922.0" y="844.25" text-anchor="middle" font-size="15" fill="#121A17">the revision</text>
