<text x="1394.0" y="799.9" text-anchor="middle" font-size="14" fill="#121A17">contradicts the design?</text>
<text x="1394.0" y="816.9" text-anchor="middle" font-size="14" fill="#121A17">(data in hand vs</text>
<text x="1394.0" y="833.9" text-anchor="middle" font-size="14" fill="#121A17">randomised; deadline vs</text>
<text x="1394.0" y="850.9" text-anchor="middle" font-size="14" fill="#121A17">prospective)</text>
